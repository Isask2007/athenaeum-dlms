name: Keep Athenaeum awake

# Render's free plan suspends a service after ~15 minutes of inactivity.
# A lightweight ping every 10 minutes keeps the public app warm.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 60 https://athenaeum-dlms.onrender.com/api/health || true
